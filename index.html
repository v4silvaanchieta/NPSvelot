<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pesquisa Interativa Velot</title>
    <link rel="icon" type="image/png" href="https://github.com/v4silvaanchieta/NPSvelot/blob/main/red_v%20(1)%20(1).pdf.png?raw=true">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="h-screen w-full bg-white text-gray-900 font-sans selection:bg-red-200 selection:text-red-900 flex flex-col overflow-hidden">

    <!-- Cabeçalho & Progresso -->
    <header class="fixed top-0 w-full bg-white/90 backdrop-blur-md z-50 shadow-sm border-b border-gray-100">
        <div class="h-1.5 w-full bg-gray-100">
            <div id="progress-bar" class="h-full bg-red-600 transition-all duration-500 ease-out" style="width: 0%;"></div>
        </div>
        <div class="max-w-5xl mx-auto px-4 md:px-6 py-2 md:py-3 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <img src="https://github.com/v4silvaanchieta/NPSvelot/blob/main/red_v%20(1)%20(1).pdf.png?raw=true" alt="Velot Motors" class="h-8 md:h-10 object-contain" />
            </div>
            <div id="header-nav" class="flex gap-2">
                <!-- Botões de navegação serão injetados aqui -->
            </div>
        </div>
    </header>

    <!-- Área de Conteúdo Principal -->
    <main class="flex-grow flex items-center justify-center px-4 md:px-6 pt-16 md:pt-20 overflow-hidden h-full">
        <div id="content-container" class="w-full h-full transition-all duration-500 ease-in-out transform opacity-100 translate-y-0 scale-100">
            <!-- O conteúdo será injetado dinamicamente aqui -->
        </div>
    </main>

    <script>
        // Dados
        const storesByState = {
            "Paraná": [
                "Curitiba", "Araucária", "São Jose dos pinhais", "Campo largo", "Fazenda Rio grande", 
                "Ponta grossa", "Telemaco Borba", "Arapoti", "Cornelio Procópio", "Ibipora", 
                "Londrina", "Apucarana", "Rolandia", "Paranavai", "Umuarama", "Toledo", 
                "Cascavel", "Maringa", "Campo mourao", "Cianorte", "Arapongas"
            ],
            "São Paulo": [
                "Itapetininga", "Indaiatuba", "Bragança Paulista", "Leme", "Dois corregos", 
                "Descalvado", "Jundiai", "Fernandopolis", "Votuporanga", "Marilia", "Guarulhos", 
                "Campinas", "Americana", "Santa barbara do oeste", "Presidente Prudente", 
                "São jose do rio preto", "São bernardo dos campo", "Sao jose dos campos", 
                "Piracicaba", "Araraquara", "Bauru", "Sorocaba"
            ],
            "Rio Grande do Sul": [
                "Farroupilha", "Caxias do sul", "Sapucaia do sul", "São Leopoldo", 
                "Novo Hamburgo", "Camaqua", "Porto Alegre"
            ],
            "Rio de Janeiro": [
                "Barra mansa", "Resende"
            ]
        };

        const questions = [
            {
                id: 'q1',
                pillar: 'Engajamento e Rotina',
                title: 'Com que frequência você ou a sua equipa mantêm o painel do CRM aberto durante o horário comercial?',
                type: 'radio',
                options: [
                    'O dia todo. Fica aberto numa aba fixa.',
                    'Algumas vezes ao dia, apenas para verificar os contatos novos.',
                    'Raramente. Entro apenas quando sou cobrado ou lembrado.',
                    'Ainda não acedi ou quase nunca acesso.'
                ]
            },
            {
                id: 'q2',
                pillar: 'Engajamento e Rotina',
                title: 'Sobre a atualização do estado dos clientes (mover os cards no funil), como é a sua rotina hoje?',
                type: 'radio',
                options: [
                    'Atualizo em tempo real, assim que falo com o cliente.',
                    'Atualizo tudo de uma vez, no final do dia ou no dia seguinte.',
                    'Deixo acumular e atualizo apenas uma vez por semana.',
                    'Esqueço de atualizar e os contatos acabam parados.'
                ]
            },
            {
                id: 'q3',
                pillar: 'Usabilidade',
                title: 'Quão fácil ou difícil é encontrar as informações e as métricas de que precisa dentro do CRM?',
                type: 'scale',
                options: [
                    '1 - Muito difícil (Confuso e perco muito tempo)',
                    '2 - Difícil',
                    '3 - Neutro (Normal)',
                    '4 - Fácil',
                    '5 - Muito fácil (Intuitivo e rápido)'
                ]
            },
            {
                id: 'q4',
                pillar: 'Usabilidade',
                title: 'Em relação à velocidade e estabilidade, como avalia o sistema no dia a dia?',
                type: 'radio',
                options: [
                    'Rápido e sem travamentos.',
                    'Lento de vez em quando, mas não atrapalha.',
                    'Trava muito e atrasa o meu atendimento.',
                    'Tenho problemas frequentes para fazer login ou carregar páginas.'
                ]
            },
            {
                id: 'q5',
                pillar: 'Atrito Operacional',
                title: 'Pensando no esforço diário, o quanto concorda com a frase: "O CRM da Velot tornou o meu processo de vendas muito mais fácil"?',
                type: 'scale',
                options: [
                    '1 - Discordo totalmente (Dá mais trabalho que ajuda)',
                    '2 - Discordo em parte',
                    '3 - Neutro (Não atrapalha, mas ainda não ajudou muito)',
                    '4 - Concordo em parte',
                    '5 - Concordo totalmente (Facilitou muito a minha vida)'
                ]
            },
            {
                id: 'q6',
                pillar: 'Atrito Operacional',
                title: 'Sendo muito sincero: hoje, qual é a MAIOR barreira que o impede de usar o CRM em 100% dos seus atendimentos?',
                type: 'radio_with_other',
                options: [
                    'Retrabalho: Ter que preencher dados no CRM e depois fazer tudo de novo na Intranet/Apolo.',
                    'Excesso de cliques: Exige muitos passos para uma ação simples.',
                    'Tempo: O balcão é muito dinâmico e não tenho tempo de abrir o sistema.',
                    'Ainda não entendi totalmente como funciona a ferramenta.',
                    'Outro (Especificar)'
                ]
            },
            {
                id: 'q7',
                pillar: 'Treinamento e Suporte',
                title: 'Como avalia a comunicação e os treinamentos fornecidos até ao momento sobre o uso do CRM?',
                type: 'scale',
                options: [
                    '1 - Insuficiente (Ainda tenho muitas dúvidas)',
                    '2 - Ruim',
                    '3 - Regular (Deu para perceber o básico)',
                    '4 - Bom',
                    '5 - Excelente (Ficou tudo muito claro)'
                ]
            },
            {
                id: 'q8',
                pillar: 'Evolução (Aberta)',
                title: 'Pensando em fechar mais negócios: O que está a FALTAR no CRM hoje para que ele seja a sua principal arma de vendas?',
                description: 'Ex: Integração direta de crédito, avisos de retorno, etc.',
                type: 'text'
            },
            {
                id: 'q9',
                pillar: 'Evolução (Aberta)',
                title: 'Se fosse o desenvolvedor do sistema por um dia e pudesse alterar ou REMOVER uma única coisa no ecrã do funil, o que seria?',
                type: 'text'
            },
            {
                id: 'q10',
                pillar: 'Feedback Livre (Aberta)',
                title: 'Espaço aberto: Partilhe connosco qualquer outro feedback, crítica ou sugestão de melhoria.',
                description: 'A sua opinião é fundamental para evoluirmos a ferramenta para si.',
                type: 'text'
            }
        ];

        // Estado da Aplicação
        const state = {
            currentStep: 0,
            answers: {},
            otherText: '',
            isAnonymous: false,
            isSubmitting: false
        };

        const totalSteps = questions.length + 2;

        // Atualização da Interface
        function updateProgress() {
            const progress = (state.currentStep / totalSteps) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;
        }

        function renderHeaderNav() {
            const nav = document.getElementById('header-nav');
            if (state.currentStep > 0 && state.currentStep <= questions.length + 1) {
                const isSubmitting = state.isSubmitting;
                const isValid = isCurrentStepValid();
                
                nav.innerHTML = `
                    <button onclick="handlePrev()" ${isSubmitting ? 'disabled' : ''} class="p-2 rounded-full transition-colors ${!isSubmitting ? 'hover:bg-gray-100 text-gray-500' : 'text-gray-300 cursor-not-allowed'}" title="Voltar">
                        <i class="ph ph-caret-down transform rotate-90 text-2xl"></i>
                    </button>
                    <button onclick="handleNext()" ${!isValid || isSubmitting ? 'disabled' : ''} class="p-2 rounded-full transition-colors ${isValid && !isSubmitting ? 'hover:bg-gray-100 text-gray-900' : 'text-gray-300'}" title="Avançar">
                        <i class="ph ph-caret-down transform -rotate-90 text-2xl"></i>
                    </button>
                `;
            } else {
                nav.innerHTML = '';
            }
        }

        function updateNextButtons() {
            renderHeaderNav();
            const mainBtn = document.getElementById('main-next-btn');
            if (mainBtn) {
                const isValid = isCurrentStepValid();
                const isLoading = state.isSubmitting;
                mainBtn.disabled = !isValid || isLoading;

                if (isValid && !isLoading) {
                    mainBtn.className = "w-full md:w-auto flex items-center justify-center gap-2 font-bold py-3 md:py-3 px-6 md:px-8 rounded-lg text-lg transition-all bg-red-600 hover:bg-red-700 text-white shadow-lg hover:shadow-red-600/30";
                } else {
                    mainBtn.className = "w-full md:w-auto flex items-center justify-center gap-2 font-bold py-3 md:py-3 px-6 md:px-8 rounded-lg text-lg transition-all bg-gray-200 text-gray-400 cursor-not-allowed";
                }
            }
        }

        // Validação
        function isCurrentStepValid() {
            if (state.currentStep === 0) return true;
            if (state.currentStep === 1) {
                if (state.isAnonymous) return true;
                return (state.answers.name || '').trim() !== '' && (state.answers.store || '').trim() !== '';
            }
            if (state.currentStep > 1 && state.currentStep <= questions.length + 1) {
                const q = questions[state.currentStep - 2];
                const answer = state.answers[q.id];
                
                if (!answer) return false;
                if (q.type === 'radio_with_other' && answer.startsWith('Outro') && state.otherText.trim() === '') return false;
                return true;
            }
            return true;
        }

        // Ações e Manipuladores de Eventos
        function handleTextChange(field, text) {
            state.answers[field] = text;
            updateNextButtons();
        }

        function handleOtherTextChange(qId, text) {
            state.otherText = text;
            state.answers[qId] = `Outro: ${text}`;
            updateNextButtons();
        }

        function handleOptionSelect(qId, optionValue, isOther = false) {
            if (isOther) {
                state.answers[qId] = `Outro: ${state.otherText}`;
            } else {
                state.answers[qId] = optionValue;
            }
            renderContent(); 
        }

        function toggleAnonymous() {
            state.isAnonymous = !state.isAnonymous;
            if (!state.isAnonymous) {
                state.answers.name = '';
                state.answers.store = '';
            }
            renderContent();
        }

        function transitionTo(newStep) {
            const container = document.getElementById('content-container');
            container.classList.remove('opacity-100', 'translate-y-0', 'scale-100');
            container.classList.add('opacity-0', 'translate-y-8', 'scale-95');

            setTimeout(() => {
                state.currentStep = newStep;
                updateProgress();
                renderHeaderNav();
                
                container.innerHTML = getStepHTML();
                
                // Foco automático - APRIMORADO PARA MOBILE
                const inputs = container.querySelectorAll('input[type="text"], textarea');
                if (inputs.length > 0 && state.currentStep > 1 && state.currentStep <= questions.length + 1) {
                     setTimeout(() => {
                        // Verifica se é mobile (largura menor que 768px - Tailwind md breakpoint)
                        const isDesktop = window.innerWidth >= 768;
                        // Impede o auto-focus nos campos de observação para não atrapalhar
                        const isObservationBox = inputs[0].placeholder && inputs[0].placeholder.includes('Quer detalhar');
                        
                        if(isDesktop && inputs[0].id !== 'other-input' && !isObservationBox) {
                            inputs[0].focus();
                        }
                     }, 100);
                }

                container.classList.remove('opacity-0', 'translate-y-8', 'scale-95');
                container.classList.add('opacity-100', 'translate-y-0', 'scale-100');
                updateNextButtons();
            }, 300);
        }

        function handleNext() {
            if (state.currentStep === questions.length + 1) {
                submitDataToWebhook();
            } else if (state.currentStep < totalSteps) {
                transitionTo(state.currentStep + 1);
            }
        }

        function handlePrev() {
            if (state.currentStep > 0 && !state.isSubmitting) {
                transitionTo(state.currentStep - 1);
            }
        }

        async function submitDataToWebhook() {
            state.isSubmitting = true;
            renderContent(); // Atualiza o botão para "Enviando..."

            const payload = {
                timestamp: new Date().toISOString(),
                anonimo: state.isAnonymous,
                nome: state.isAnonymous ? 'Anônimo' : state.answers.name,
                loja: state.isAnonymous ? 'Não identificada' : state.answers.store,
                respostas: { ...state.answers }
            };

            const WEBHOOK_URL = 'https://v4silvaanchieta.site/webhook/npsvelot';

            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (!response.ok) throw new Error('Falha ao enviar os dados');

                transitionTo(state.currentStep + 1);
            } catch (error) {
                console.error("Erro ao enviar respostas:", error);
                alert("Houve um erro ao enviar as suas respostas. Por favor, tente novamente.");
                state.isSubmitting = false;
                renderContent();
            }
        }

        // Renderizadores de HTML
        function getNextButtonHTML() {
            const isFinal = state.currentStep === questions.length + 1;
            let btnText = "Avançar";
            let iconHTML = `<i class="ph ph-caret-right text-xl"></i>`;

            if (state.isSubmitting) {
                btnText = "Enviando...";
                iconHTML = `<i class="ph ph-spinner animate-spin text-xl"></i>`;
            } else if (isFinal) {
                btnText = "Finalizar Pesquisa";
                iconHTML = `<i class="ph ph-check text-xl"></i>`;
            } else if (state.currentStep === 0) {
                btnText = "Começar a Pesquisa";
            } else if (state.currentStep > 1) {
                btnText = "OK";
                iconHTML = `<i class="ph ph-check text-xl"></i>`;
            }

            return `
                <div class="mt-6 md:mt-8 flex flex-col md:flex-row items-center gap-4 flex-shrink-0 w-full md:w-auto pb-8 md:pb-0">
                    <button id="main-next-btn" onclick="handleNext()" class="w-full md:w-auto flex items-center justify-center gap-2 font-bold py-3 md:py-3 px-6 md:px-8 rounded-lg text-lg transition-all bg-red-600 text-white">
                        ${btnText} ${iconHTML}
                    </button>
                    
                    <div class="text-sm text-gray-400 hidden md:flex items-center gap-2">
                        Pressione <kbd class="bg-gray-100 border border-gray-300 rounded px-2 py-1 font-mono font-bold text-gray-600">Enter</kbd>
                    </div>
                </div>
            `;
        }

        function getIntroHTML() {
            return `
                <div class="flex flex-col items-start justify-center h-full max-w-3xl mx-auto space-y-6 animate-fade-in-up">
                    <div class="bg-red-600 text-white text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider mb-2">
                        A Voz do Lojista
                    </div>
                    <h1 class="text-4xl md:text-5xl font-extrabold text-gray-900 leading-tight">
                        Pesquisa de Usabilidade e Evolução: <span class="text-red-600">CRM</span>
                    </h1>
                    <p class="text-lg md:text-xl text-gray-600 leading-relaxed">
                        Olá, Parceiro Velot! <br><br>
                        O nosso CRM nasceu para ser um <strong>organismo vivo</strong>. Para garantirmos que a ferramenta facilite a sua vida e aumente as suas vendas, precisamos entender exatamente a sua experiência atual e mapear o que precisa melhorar.
                    </p>
                    <p class="text-md text-gray-500 bg-gray-50 p-4 rounded-lg border border-gray-100 w-full">
                        ⏱️ Levará menos de 3 minutos. As suas respostas, feedbacks e observações vão ditar as próximas atualizações da plataforma!
                    </p>
                    ${getNextButtonHTML()}
                </div>
            `;
        }

        function getIdentificationHTML() {
            let optionsHTML = '<option value="" disabled selected>Selecione uma cidade...</option>';
            for (const [stateName, cities] of Object.entries(storesByState)) {
                optionsHTML += `<optgroup label="${stateName}">`;
                cities.forEach(city => {
                    const val = `${city} - ${stateName}`;
                    const isSelected = state.answers.store === val ? 'selected' : '';
                    optionsHTML += `<option value="${val}" ${isSelected}>${city}</option>`;
                });
                optionsHTML += `</optgroup>`;
            }

            const isAnon = state.isAnonymous;
            const disabledClass = isAnon ? 'opacity-30 pointer-events-none grayscale' : 'opacity-100';

            return `
                <div class="flex flex-col justify-center h-full max-w-3xl mx-auto animate-fade-in-up w-full">
                    <div class="text-sm font-semibold text-red-600 uppercase tracking-wider mb-4 flex items-center gap-2">
                        <span>Identificação</span>
                    </div>
                    
                    <h2 class="text-3xl md:text-4xl font-bold text-gray-900 leading-tight mb-6 md:mb-8">
                        Antes de começarmos, conte-nos quem é:
                    </h2>

                    <div class="mb-6 md:mb-8 p-3 md:p-4 bg-gray-50 rounded-xl border border-gray-200">
                        <label class="flex items-center cursor-pointer group">
                            <div class="relative flex items-center">
                                <input type="checkbox" class="peer sr-only" ${isAnon ? 'checked' : ''} onchange="toggleAnonymous()">
                                <div class="w-6 h-6 bg-white border-2 border-gray-300 rounded-md peer-checked:bg-red-600 peer-checked:border-red-600 transition-colors flex items-center justify-center">
                                    ${isAnon ? '<i class="ph ph-check text-white"></i>' : ''}
                                </div>
                            </div>
                            <div class="ml-4 flex flex-col">
                                <span class="text-lg font-bold text-gray-800 group-hover:text-red-600 transition-colors">
                                    Quero responder anonimamente
                                </span>
                                <span class="text-sm text-gray-500">
                                    Os seus dados pessoais não serão registados. A sua sinceridade é o mais importante.
                                </span>
                            </div>
                        </label>
                    </div>

                    <div class="space-y-4 md:space-y-6 transition-all duration-500 ${disabledClass}">
                        <div>
                            <label class="flex items-center gap-2 text-lg font-medium text-gray-700 mb-2">
                                <i class="ph ph-user text-xl ${isAnon ? 'text-gray-400' : 'text-red-600'}"></i>
                                Qual o seu nome?
                            </label>
                            <input type="text" placeholder="Digite o seu nome ou o da sua equipa..." 
                                value="${state.answers.name || ''}" 
                                oninput="handleTextChange('name', this.value)" 
                                ${isAnon ? 'disabled' : ''} 
                                class="w-full p-3 md:p-4 rounded-xl border-2 border-gray-200 focus:border-red-600 focus:ring-4 focus:ring-red-100 transition-all outline-none text-lg text-gray-900 bg-white disabled:bg-gray-100">
                        </div>

                        <div>
                            <label class="flex items-center gap-2 text-lg font-medium text-gray-700 mb-2">
                                <i class="ph ph-map-pin text-xl ${isAnon ? 'text-gray-400' : 'text-red-600'}"></i>
                                Selecione a sua loja parceira:
                            </label>
                            <div class="relative">
                                <select onchange="handleTextChange('store', this.value)" ${isAnon ? 'disabled' : ''} 
                                    class="w-full p-3 md:p-4 rounded-xl border-2 border-gray-200 focus:border-red-600 focus:ring-4 focus:ring-red-100 transition-all outline-none text-lg text-gray-900 bg-white appearance-none cursor-pointer disabled:bg-gray-100 disabled:cursor-not-allowed">
                                    ${optionsHTML}
                                </select>
                                <div class="absolute right-4 top-1/2 transform -translate-y-1/2 pointer-events-none text-gray-400">
                                    <i class="ph ph-caret-down text-2xl"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                    ${getNextButtonHTML()}
                </div>
            `;
        }

        function getQuestionHTML() {
            const qIndex = state.currentStep - 2;
            const q = questions[qIndex];
            const answer = state.answers[q.id];
            const observation = state.answers[`${q.id}_obs`] || '';

            let optionsContent = '';

            if (q.type === 'radio' || q.type === 'scale') {
                optionsContent = q.options.map((opt, idx) => {
                    const isSelected = answer === opt;
                    return `
                        <button onclick="handleOptionSelect('${q.id}', '${opt}')" class="w-full text-left p-3 md:p-4 rounded-xl border-2 transition-all duration-200 flex items-center group ${isSelected ? 'border-red-600 bg-red-50 shadow-sm' : 'border-gray-200 hover:border-red-300 hover:bg-gray-50'}">
                            <div class="w-6 h-6 rounded-full border-2 flex items-center justify-center mr-3 md:mr-4 flex-shrink-0 transition-colors ${isSelected ? 'border-red-600' : 'border-gray-300 group-hover:border-red-400'}">
                                ${isSelected ? '<div class="w-3 h-3 bg-red-600 rounded-full"></div>' : ''}
                            </div>
                            <span class="text-base md:text-lg ${isSelected ? 'text-gray-900 font-medium' : 'text-gray-700'}">${opt}</span>
                        </button>
                    `;
                }).join('');
            } else if (q.type === 'radio_with_other') {
                optionsContent = `<div class="space-y-3">` + q.options.map((opt, idx) => {
                    const isOther = opt.startsWith('Outro');
                    const isSelected = answer === opt || (isOther && answer?.startsWith('Outro'));
                    
                    let html = `
                        <div class="flex flex-col">
                            <button onclick="handleOptionSelect('${q.id}', '${isOther ? `Outro: ${state.otherText}` : opt}', ${isOther})" class="w-full text-left p-3 md:p-4 rounded-xl border-2 transition-all duration-200 flex items-center group ${isSelected ? 'border-red-600 bg-red-50 shadow-sm' : 'border-gray-200 hover:border-red-300 hover:bg-gray-50'}">
                                <div class="w-6 h-6 rounded-full border-2 flex items-center justify-center mr-3 md:mr-4 flex-shrink-0 transition-colors ${isSelected ? 'border-red-600' : 'border-gray-300 group-hover:border-red-400'}">
                                    ${isSelected ? '<div class="w-3 h-3 bg-red-600 rounded-full"></div>' : ''}
                                </div>
                                <span class="text-base md:text-lg ${isSelected ? 'text-gray-900 font-medium' : 'text-gray-700'}">${opt}</span>
                            </button>
                    `;

                    if (isOther && isSelected) {
                        html += `
                            <div class="mt-3 ml-10 animate-fade-in-up">
                                <input id="other-input" type="text" placeholder="Especifique o motivo..." 
                                    value="${state.otherText}" 
                                    oninput="handleOtherTextChange('${q.id}', this.value)" 
                                    class="w-full p-3 md:p-4 border-b-2 border-red-600 bg-transparent focus:outline-none text-base md:text-lg text-gray-900">
                            </div>
                        `;
                    }
                    html += `</div>`;
                    return html;
                }).join('') + `</div>`;
            } else if (q.type === 'text') {
                optionsContent = `
                    <div class="w-full h-full">
                        <textarea rows="5" placeholder="Digite o seu feedback aqui..." 
                            oninput="handleTextChange('${q.id}', this.value)" 
                            class="w-full p-4 md:p-5 rounded-xl border-2 border-gray-200 focus:border-red-600 focus:ring-4 focus:ring-red-100 transition-all outline-none text-base md:text-lg text-gray-900 resize-none bg-gray-50 focus:bg-white shadow-inner">${answer || ''}</textarea>
                    </div>
                `;
            }

            let observationHTML = '';
            if (q.type !== 'text') {
                observationHTML = `
                    <div class="mt-4 md:mt-6 w-full flex-shrink-0 bg-gray-50 border border-gray-100 rounded-xl p-3 md:p-4">
                        <label class="flex items-center gap-2 text-sm font-semibold text-gray-600 mb-2">
                            <i class="ph ph-chat-circle-text text-base"></i> Observações de melhoria (Opcional)
                        </label>
                        <textarea rows="2" placeholder="Quer detalhar a sua resposta ou sugerir algo? Escreva aqui..." 
                            oninput="handleTextChange('${q.id}_obs', this.value)" 
                            class="w-full p-2 md:p-3 rounded-lg border border-gray-200 focus:border-red-400 focus:ring-2 focus:ring-red-50 transition-all outline-none text-sm md:text-base text-gray-800 resize-none bg-white">${observation}</textarea>
                    </div>
                `;
            }

            return `
                <div class="flex flex-col justify-start pt-4 md:pt-10 h-full max-w-3xl mx-auto animate-fade-in-up w-full overflow-y-auto pb-32 md:pb-20 no-scrollbar">
                    <div class="text-xs md:text-sm font-semibold text-red-600 uppercase tracking-wider mb-2 md:mb-4 flex items-center gap-2 flex-shrink-0">
                        <span>${state.currentStep - 1} de ${questions.length}</span>
                        <span class="w-1 h-1 bg-red-600 rounded-full"></span>
                        <span>${q.pillar}</span>
                    </div>
                    
                    <h2 class="text-xl md:text-3xl font-bold text-gray-900 leading-tight mb-2 flex-shrink-0">
                        ${q.title}
                    </h2>
                    
                    ${q.description ? `<p class="text-base md:text-lg text-gray-500 mb-4 md:mb-6 italic flex-shrink-0">${q.description}</p>` : ''}

                    <div class="mt-4 md:mt-6 space-y-2 md:space-y-3 w-full flex-shrink-0">
                        ${optionsContent}
                    </div>

                    ${observationHTML}
                    ${getNextButtonHTML()}
                </div>
            `;
        }

        function getOutroHTML() {
            let message = '';
            if (state.isAnonymous) {
                message = `
                    <div class="flex flex-col items-center gap-3">
                        <i class="ph ph-shield-check text-4xl text-gray-400"></i>
                        <p class="text-lg md:text-xl text-gray-600 leading-relaxed">
                            Muito obrigado pela transparência! <br/>
                            Os seus feedbacks anónimos foram registados de forma segura e vão direto para a nossa equipa de tecnologia.
                        </p>
                    </div>
                `;
            } else {
                const firstName = state.answers.name ? state.answers.name.split(' ')[0] : '';
                const storeName = state.answers.store ? state.answers.store.split(' - ')[0] : '';
                message = `
                    <p class="text-lg md:text-xl text-gray-600 leading-relaxed">
                        Muito obrigado pela transparência, <strong>${firstName}</strong>! <br/>
                        Os seus feedbacks da unidade de <strong>${storeName}</strong> vão direto para a nossa equipa de tecnologia.
                    </p>
                `;
            }

            return `
                <div class="flex flex-col items-center text-center justify-center h-full max-w-2xl mx-auto space-y-6 animate-fade-in-up pb-20">
                    <div class="w-16 h-16 md:w-20 md:h-20 bg-green-100 rounded-full flex items-center justify-center mb-2 md:mb-4">
                        <i class="ph ph-check text-3xl md:text-4xl text-green-600"></i>
                    </div>
                    <h1 class="text-3xl md:text-5xl font-extrabold text-gray-900 leading-tight">
                        Respostas enviadas com sucesso!
                    </h1>
                    
                    ${message}

                    <h2 class="text-xl md:text-2xl font-bold text-red-600 mt-2 md:mt-4">Juntos somos mais fortes. Boas vendas!</h2>
                    
                    <button onclick="window.location.reload()" class="mt-6 md:mt-8 text-gray-500 hover:text-gray-800 underline transition-colors">
                        Voltar ao início
                    </button>
                </div>
            `;
        }

        function getStepHTML() {
            if (state.currentStep === 0) return getIntroHTML();
            if (state.currentStep === 1) return getIdentificationHTML();
            if (state.currentStep > 1 && state.currentStep <= questions.length + 1) return getQuestionHTML();
            return getOutroHTML();
        }

        function renderContent() {
            const container = document.getElementById('content-container');
            container.innerHTML = getStepHTML();
            updateNextButtons();
        }

        // Evento de Teclado (Enter)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                if (isCurrentStepValid() && document.activeElement.tagName !== 'TEXTAREA' && !state.isSubmitting) {
                    e.preventDefault();
                    handleNext();
                }
            }
        });

        // Inicialização
        window.onload = () => {
            updateProgress();
            renderContent();
        };
    </script>
</body>
</html>
